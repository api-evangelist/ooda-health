name: Ooda Health
description: 'OODA Health is a healthcare technology company modernizing the business
  of healthcare by automating administration and payments between payers, providers,
  and patients. Its flagship platform, OODAPay, coordinates billing across all parties
  to give patients a single consolidated bill while reducing provider administrative
  burden and bad debt; OODA Optic extends its analytics and administrative tooling.
  OODA Health worked with payers and health systems including Anthem, CommonSpirit
  Health, Blue Cross Blue Shield of Massachusetts and Arizona, Blue Shield of California,
  and Hill Physicians Medical Group, and was acquired by Cedar. The company was backed
  by Threshold Ventures. No public API, developer portal, or SDK surface has been identified.'
